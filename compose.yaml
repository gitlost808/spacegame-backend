services:
  app:
    build: .
    environment:
      HTTP_ADDR: :8080
      GIN_MODE: release
      DATABASE_URL: postgres://spacegame:spacegame@db:5432/spacegame?sslmode=disable
      SESSION_MIN_DURATION: ${SESSION_MIN_DURATION:-1s}
      SESSION_MAX_DURATION: ${SESSION_MAX_DURATION:-1h}
      MAX_SCORE_PER_SECOND: ${MAX_SCORE_PER_SECOND:-1000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spacegame
      POSTGRES_USER: spacegame
      POSTGRES_PASSWORD: spacegame
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
