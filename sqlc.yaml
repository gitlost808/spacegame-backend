version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/queries.sql
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            nullable: false
            go_type:
              import: time
              type: Time
