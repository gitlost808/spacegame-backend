services:
  app:
    build: .
    environment:
      HTTP_ADDR: :8080
      GIN_MODE: release
      DATABASE_URL: postgres://spacegame:spacegame@db:5432/spacegame?sslmode=disable
      SESSION_MIN_DURATION: ${SESSION_MIN_DURATION:-1s}
      SESSION_MAX_DURATION: ${SESSION_MAX_DURATION:-1h}
      MAX_SCORE_PER_SECOND: ${MAX_SCORE_PER_SECOND:-1000}
      SESSION_MAX_CHECKPOINT_GAP: ${SESSION_MAX_CHECKPOINT_GAP:-30s}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_ENV: development
      METRICS_ADDR: :9090
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-5m}
      EXPIRED_SESSION_RETENTION: ${EXPIRED_SESSION_RETENTION:-24h}
      CLEANUP_BATCH_SIZE: ${CLEANUP_BATCH_SIZE:-1000}
      RATE_LIMIT_START_PER_MINUTE: ${RATE_LIMIT_START_PER_MINUTE:-30}
      RATE_LIMIT_START_BURST: ${RATE_LIMIT_START_BURST:-10}
      RATE_LIMIT_CHECKPOINT_PER_MINUTE: ${RATE_LIMIT_CHECKPOINT_PER_MINUTE:-240}
      RATE_LIMIT_CHECKPOINT_BURST: ${RATE_LIMIT_CHECKPOINT_BURST:-30}
      RATE_LIMIT_FINISH_PER_MINUTE: ${RATE_LIMIT_FINISH_PER_MINUTE:-120}
      RATE_LIMIT_FINISH_BURST: ${RATE_LIMIT_FINISH_BURST:-20}
      RATE_LIMIT_LEADERBOARD_PER_MINUTE: ${RATE_LIMIT_LEADERBOARD_PER_MINUTE:-300}
      RATE_LIMIT_LEADERBOARD_BURST: ${RATE_LIMIT_LEADERBOARD_BURST:-30}
      RATE_LIMIT_GLOBAL_PER_SECOND: ${RATE_LIMIT_GLOBAL_PER_SECOND:-50}
      RATE_LIMIT_GLOBAL_BURST: ${RATE_LIMIT_GLOBAL_BURST:-100}
      RATE_LIMIT_MAX_CLIENTS: ${RATE_LIMIT_MAX_CLIENTS:-10000}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: spacegame
      POSTGRES_USER: spacegame
      POSTGRES_PASSWORD: spacegame
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
